name: document_scanner
description: "A Flutter package for detecting documents and cropping images with perspective correction."
version: 0.0.1

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  image: ^4.1.7
  opencv_dart: ^1.0.4
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

